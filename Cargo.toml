[workspace]
members = [
    "apps/bestiary-export",
    "apps/battle-demo",
    "crates/bestiary",
    "crates/crystalline",
    "crates/crystalline-bestiary-adapter",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
